name: 配置分支保护

# 用途：把 .github/branch-protection.json 里的规则下发到 main 分支。
#
# 为什么不能全自动：管理分支保护需要仓库管理（administration）权限，而它
# **不在 GITHUB_TOKEN 的权限表里**（属于细粒度 PAT 的权限）。把
# administration: write 写成 workflow 权限会被直接拒绝：
#   Invalid workflow file: (Line: 17, Col: 3): Unexpected value 'administration'
# 因此这里改用可选的 PAT Secret；没配就只打印提示并跳过，不让流水线变红。
on:
  push:
    branches: [main]
    paths:
      - .github/branch-protection.json
      - .github/workflows/setup-branch-protection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    name: 应用分支保护规则
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 下发分支保护规则
        env:
          # 需要在仓库 Secret 里配置 BRANCH_PROTECTION_TOKEN
          # （细粒度 PAT，权限 Administration: Read and write）
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::未配置 BRANCH_PROTECTION_TOKEN，跳过下发。"
            echo "GITHUB_TOKEN 不含 administration 权限，分支保护只能手动点或用 PAT。"
            echo "两种做法见 README「分支保护」一节。"
            exit 0
          fi
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/branches/main/protection" \
            --input .github/branch-protection.json
          echo "下发成功，当前生效规则："
          gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection" \
            --jq '{checks: [.required_status_checks.checks[].context], strict: .required_status_checks.strict, allow_force_push: .allow_force_push, allow_deletions: .allow_deletions}'
